[package]
name = "lk-rtcio"
description = "UDP/TCP mux, shard reactors and the PeerConnection driver over the sans-IO `rtc` core."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["udp"]
# The real-socket transport. Off in pure-simulation builds so that the vnet
# suites do not pull in quinn-udp or a tokio net stack.
udp = ["dep:quinn-udp", "dep:socket2", "tokio/net", "tokio/rt"]

[dependencies]
ahash.workspace = true
bytes.workspace = true
rand.workspace = true
rtc.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

quinn-udp = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
