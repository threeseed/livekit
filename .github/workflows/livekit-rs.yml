# CI for the Rust port (issue #979, mirroring plan section 8.8).
#
# The jobs here are the full table from the issue. Several run zero tests
# today; that is deliberate. Standing them up in Phase 0 means every later
# phase adds tests to a job that already exists, already has a budget and
# already gates merges, rather than trying to introduce a sanitiser job at the
# same time as the code it is meant to check.
name: livekit-rs

on:
  push:
    branches: [master, main]
    paths: ['livekit-rs/**', '.github/workflows/livekit-rs.yml', 'go.mod']
  pull_request:
    paths: ['livekit-rs/**', '.github/workflows/livekit-rs.yml', 'go.mod']
  schedule:
    # Nightly, 03:00 UTC.
    - cron: '0 3 * * *'
    # Weekly soak, Sunday 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: livekit-rs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: livekit-rs

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A build that has to reach the network for a proto compiler is a build that
  # breaks when the network does. `protox` is a pure-Rust protobuf compiler, so
  # no job here installs protoc.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (fmt, clippy, deny, audit, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: livekit-rs/Cargo.toml
          command: check bans licenses sources advisories
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: doc build
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: proto pin matches the Go server
        # The compatibility check that costs nothing and catches the drift that
        # would otherwise surface as a mixed-cluster failure.
        run: cargo xtask proto-sync --check --go-mod ../go.mod

  unit:
    name: unit (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # MSRV is pinned in the workspace manifest; this matrix must name the
        # same version.
        toolchain: [stable, "1.90"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: nextest with coverage
        run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        if: matrix.toolchain == 'stable'
        with:
          files: livekit-rs/lcov.info
          flags: livekit-rs
        continue-on-error: true

  sim:
    name: sim (vnet, 3 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A seeded simulation that is only ever run on one seed is a fixed
        # test wearing a simulator's clothes. Three seeds per PR, and the
        # nightly sweep below widens it.
        seed: [1, 20260918, 4294967291]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: vnet suites
        env:
          LK_VNET_SEED: ${{ matrix.seed }}
        run: cargo nextest run -p lk-rtcio --all-features
      - name: turmoil suites
        # Control-plane simulation lands with lk-bus and lk-room in Phase 1 and
        # Phase 4; the job exists now so those phases only add tests.
        run: echo "no turmoil suites yet (Phase 1)"

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cross-crate integration tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo nextest run -p lk-integration-tests --all-features

  interop:
    name: interop (Go client, mixed cluster, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Expensive and slow, so it runs nightly and on demand rather than on every
    # PR. Label a PR `interop` to opt in.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'interop')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - name: Go client against the Rust server
        run: echo "no signalling server yet (Phase 1)"
      - name: mixed Go/Rust cluster over Redis
        run: echo "no Redis bus yet (Phase 4)"
      - name: browser interop
        # The exit gate's "and with a real Chrome client" clause lands here.
        run: echo "no browser harness yet (Phase 1)"

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: ten minutes per target
        run: |
          for target in $(cargo fuzz list --fuzz-dir fuzz); do
            echo "::group::$target"
            cargo fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=600
            echo "::endgroup::"
          done
      - name: minimise corpora
        run: |
          for target in $(cargo fuzz list --fuzz-dir fuzz); do
            cargo fuzz cmin --fuzz-dir fuzz "$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: livekit-rs/fuzz/artifacts

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - name: criterion
        # Pinned-runner comparison against a stored baseline is set up with the
        # first real benchmark in Phase 2; today this only guards compilation
        # and gross regressions.
        run: cargo bench -p lk-benches -- --warm-up-time 1 --measurement-time 3
      - name: exit-gate timing
        # The Phase-0 exit gate has a wall-clock clause, so it is a perf gate
        # as much as a correctness one.
        run: cargo test -p lk-rtcio --release --test udp_mux_bringup -- --nocapture

  sanitizers:
    name: sanitizers (TSan, Miri, loom)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - name: Miri on the pure parsers
        # Only the parsers: Miri cannot run the crypto or the socket code, and
        # the parsers are where an out-of-bounds read would actually hide.
        run: cargo miri test -p lk-rtcio --lib stun::
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      - name: ThreadSanitizer
        run: cargo test -p lk-rtcio --target x86_64-unknown-linux-gnu --lib
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
      - name: loom
        # The SPSC ring and the shard queues get loom coverage when they exist
        # (Phase 1).
        run: echo "no loom models yet (Phase 1)"

  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: livekit-rs
      - name: long simulated run with churn
        # The plan's 72-hour soak with RSS, fd and latency assertions needs a
        # server to soak; today this runs the simulator long enough to catch an
        # unbounded queue.
        run: cargo test -p lk-rtcio --release --test udp_mux_bringup -- --nocapture

  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/livekit-rs-v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: static binaries
        run: |
          cross build --release -p lk-server --target x86_64-unknown-linux-musl
          cross build --release -p lk-server --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: livekit-server-rs
          path: |
            livekit-rs/target/x86_64-unknown-linux-musl/release/livekit-server
            livekit-rs/target/aarch64-unknown-linux-musl/release/livekit-server
